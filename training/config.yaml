# Training Configuration for Playlist Ranking Model

# Model Architecture
input_dim: 32
hidden_dims: [128, 64, 32]
dropout: 0.3

# Training Hyperparameters
batch_size: 512
learning_rate: 0.001
weight_decay: 0.00001
num_epochs: 50
patience: 5  # Early stopping patience

# Loss Function
margin: 0.5  # Pairwise margin
max_grad_norm: 1.0  # Gradient clipping

# Constraint Weights
lambda_fatigue: 0.1      # Artist repetition penalty
lambda_diversity: 0.05   # Diversity (entropy) penalty
lambda_exposure: 0.03    # Exposure fairness penalty

# Data
num_negatives: 5  # Negatives per positive during feature extraction

# Evaluation
top_k: 10  # Number of top results for constraint evaluation

# Experiment Tracking
experiment_name: "full_constraints"
log_interval: 100  # Log every N batches

# Notes:
# - Set lambda_* to 0.0 to disable specific constraints
# - For baseline (no constraints): lambda_fatigue=0.0, lambda_diversity=0.0, lambda_exposure=0.0
# - Increase batch_size if you have more memory
# - Decrease learning_rate if training is unstable
